MEMORY {
    # The first three black bitmap cells end before the moving left gutter.
    LOW: start=$0801, size=$1817, file=%O;
    # The first five glyph scanlines share two pages with native code.
    FONT: start=$4000, size=$1e0, fill=yes, file="%O.hi";
    FONTGAP: start=$41e0, size=$20, fill=yes, file="%O.hi";
    HIGH: start=$4200, size=$1600, file="%O.hi";
    # Black bitmap row 24, between the staged colours and staged pixels.
    HIDDEN: start=$3e00, size=$100, file="%O.hidden";
    CAMINIT: start=$3f00, size=$100, file="%O.caminit";
    # KERNAL work area, unused once the game owns the machine.
    PAGE2: start=$0200, size=$0200, type=rw, file="";
    # Each gap spans the last four columns of one row and the first four
    # of the next. build.py inserts the 64 bytes before packing.
    GAP0: start=$2120, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP1: start=$2260, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP2: start=$23A0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP3: start=$24E0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP4: start=$2620, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP5: start=$2760, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP6: start=$28A0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP7: start=$29E0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP8: start=$2B20, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP9: start=$2C60, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP10: start=$2DA0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP11: start=$2EE0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP12: start=$3020, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP13: start=$3160, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP14: start=$32A0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP15: start=$33E0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP16: start=$3520, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP17: start=$3660, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP18: start=$37A0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP19: start=$38E0, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP20: start=$3A20, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP21: start=$3B60, size=64, type=rw, fill=yes, file="%O.gaps";
    GAP22: start=$3CA0, size=64, type=rw, fill=yes, file="%O.gaps";
    # Native memory areas
}
SEGMENTS {
    CODE: load=LOW, type=rw;
    PAN: load=LOW, type=rw, optional=yes;
    GLYPHS: load=FONT, type=rw;
    EXT: load=HIGH, type=rw;
    ROWCODE: load=HIDDEN, type=rw;
    CAMBOOT: load=CAMINIT, type=rw, optional=yes;
    TABLES: load=PAGE2, type=bss;
    G0: load=GAP0, type=rw, optional=yes;
    G1: load=GAP1, type=rw, optional=yes;
    G2: load=GAP2, type=rw, optional=yes;
    G3: load=GAP3, type=rw, optional=yes;
    G4: load=GAP4, type=rw, optional=yes;
    G5: load=GAP5, type=rw, optional=yes;
    G6: load=GAP6, type=rw, optional=yes;
    G7: load=GAP7, type=rw, optional=yes;
    G8: load=GAP8, type=rw, optional=yes;
    G9: load=GAP9, type=rw, optional=yes;
    G10: load=GAP10, type=rw, optional=yes;
    G11: load=GAP11, type=rw, optional=yes;
    G12: load=GAP12, type=rw, optional=yes;
    G13: load=GAP13, type=rw, optional=yes;
    G14: load=GAP14, type=rw, optional=yes;
    G15: load=GAP15, type=rw, optional=yes;
    G16: load=GAP16, type=rw, optional=yes;
    G17: load=GAP17, type=rw, optional=yes;
    G18: load=GAP18, type=rw, optional=yes;
    G19: load=GAP19, type=rw, optional=yes;
    G20: load=GAP20, type=rw, optional=yes;
    G21: load=GAP21, type=rw, optional=yes;
    G22: load=GAP22, type=rw, optional=yes;
    # Native segments
}
